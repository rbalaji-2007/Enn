{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Enn - Analytics</title>
        <link rel="icon" type="image/png" href="{% static 'images/enn-logo.png' %}" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="{% static 'css/analytics/style.css' %}" />
    </head>

    <body>
        <div class="analytics-cont">
            <nav class="sidebar">
                <div class="enn">
                    <img
                        src="{% static 'images/enn-logo.png' %}"
                        alt="Enn. Logo"
                        class="ennlogo"
                    />
                    <h1>Enn.</h1>
                </div>
                <div class="sideopts">
                    <a href="/">
                        <div class="sideelements">
                            <p>Dashboard</p>
                        </div>
                    </a>
                    <div class="sideelements" id="sideselected">
                        <p>Analytics</p>
                    </div>
                    <a href="/settings">
                        <div class="sideelements">
                            <p>Settings</p>
                        </div>
                    </a>
                </div>
            </nav>
            <nav class="analyticsMain">
                <canvas id="maingraph"></canvas>
                <div class="bars">
                    {% for bar in category_bars %}
                    <div class="barelements">
                        <p class="label">{{ bar.name }}</p>
                        <p class="lableamount">{{ currency }}{{ bar.amount }}</p>
                        <div class="bar">
                            <div class="fill" style="--fill-width: {{ bar.percent }}%; width: var(--fill-width, 0%);"></div>
                        </div>
                    </div>
                    {% empty %}
                    <div class="barelements">
                        <p class="label">No Data</p>
                        <p class="lableamount">{{ currency }}0.00</p>
                        <div class="bar">
                            <div class="fill" style="width: 0%"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </nav>
        </div>

        <script id="chart-labels-data" type="application/json">{{ chart_labels_json|safe }}</script>
        <script id="chart-expense-data" type="application/json">{{ chart_expense_json|safe }}</script>
        <script id="chart-income-data" type="application/json">{{ chart_income_json|safe }}</script>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</html>
