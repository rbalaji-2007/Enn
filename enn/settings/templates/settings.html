{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Enn - Settings</title>
        <link rel="icon" type="image/png" href="{% static 'images/enn-logo.png' %}" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="{% static 'css/settings/style.css' %}" />
    </head>

    <body>
        <div class="analytics-cont">
            <nav class="sidebar">
                <div class="enn">
                    <img
                        src="{% static 'images/enn-logo.png' %}"
                        alt="Enn. Logo"
                        class="ennlogo"
                    />
                    <h1>Enn.</h1>
                </div>
                <div class="sideopts">
                    <a href="/">
                        <div class="sideelements">
                            <p>Dashboard</p>
                        </div>
                    </a>
                    <a href="/analytics">
                        <div class="sideelements">
                            <p>Analytics</p>
                        </div>
                    </a>
                    <div class="sideelements" id="sideselected">
                        <p>Settings</p>
                    </div>
                </div>
            </nav>
            <nav class="analyticsMain">
                <form method="post" style="display: flex; flex-direction: column; gap: 2em; align-items: center; width: 100%;">
                    {% csrf_token %}
                    <div class="mainelements">
                        <p>User Name</p>
                        <input type="text" name="name" value="{{ name }}" class="mainelementinput" required>
                    </div>
                    <div class="mainelements">
                        <p>Danger Zone</p>
                        <button type="submit" name="action" value="reset" style="background-color: hsl(0, 60%, 40%); color: white; width: 8em;" onclick="return confirm('Are you sure you want to reset all transaction history?');">Reset All Data</button>
                    </div>
                    <div class="mainelementsavebtn">
                        <button type="submit" name="action" value="save" style="background-color: hsl(270, 50%, 35%); color: white; width: 6em;">Save</button>
                    </div>
                </form>
            </nav>
        </div>
    </body>
    <script src="{% static 'js/script.js' %}"></script>
</html>
